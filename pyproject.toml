[project]
name = "exam-agent"
version = "0.1.0"
description = "Finds exam announcements in my email and puts them in my calendar"
readme = "README.md"
authors = [
    { name = "Hlib KHARYTONOV", email = "hlibkharytonov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "icalendar>=7.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
exam-agent = "exam_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["api: calls the real Claude API (costs money); run with -m api"]
addopts = "-m 'not api'"
